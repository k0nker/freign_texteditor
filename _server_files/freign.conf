server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Static asset compression (browser auto-decompresses).
    gzip on;
    gzip_comp_level 6;
    gzip_min_length 1024;
    gzip_vary on;
    gzip_proxied any;
    gzip_types
        text/plain
        text/css
        text/javascript
        application/javascript
        application/json
        application/xml
        application/rss+xml
        image/svg+xml;

    location /play/ws {
        # WebSocket frame compression is negotiated by play-bridge (permessage-deflate),
        # while nginx here handles only HTTP upgrade proxying.
        proxy_pass http://play-bridge:9001/ws;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 3600;
        proxy_send_timeout 3600;
        proxy_buffering off;
    }

    location = /frmapper/ws/public {
        proxy_pass http://192.168.86.99:25555/frmapper/ws;
        proxy_http_version 1.1;
        # Force websocket upgrade semantics even when upstream/header rewriting is inconsistent.
        proxy_set_header Upgrade websocket;
        proxy_set_header Connection "Upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 5;
        proxy_read_timeout 3600;
        proxy_send_timeout 3600;
        proxy_buffering off;
        proxy_request_buffering off;
        proxy_cache_bypass $http_upgrade;
    }

    location = /frmapper/ws/test {
        proxy_pass http://192.168.86.99:25556/frmapper/ws;
        proxy_http_version 1.1;
        # Force websocket upgrade semantics even when upstream/header rewriting is inconsistent.
        proxy_set_header Upgrade websocket;
        proxy_set_header Connection "Upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 5;
        proxy_read_timeout 3600;
        proxy_send_timeout 3600;
        proxy_buffering off;
        proxy_request_buffering off;
        proxy_cache_bypass $http_upgrade;
    }

    # Catch unexpected frmapper websocket paths early instead of proxying to the wrong upstream path.
    location /frmapper/ws/ {
        return 404;
    }

    location /api/status/public {
        proxy_pass http://192.168.86.99:25555/status;
        proxy_set_header Host $host;
        proxy_read_timeout 5;
        proxy_connect_timeout 3;
        add_header Access-Control-Allow-Origin *;
        add_header Cache-Control no-store;
    }

    location /api/status/test {
        proxy_pass http://192.168.86.99:25556/status;
        proxy_set_header Host $host;
        proxy_read_timeout 5;
        proxy_connect_timeout 3;
        add_header Access-Control-Allow-Origin *;
        add_header Cache-Control no-store;
    }

    location /api/world/public {
        proxy_pass http://192.168.86.99:25555/api/world;
        proxy_set_header Host $host;
        proxy_read_timeout 30;
        proxy_connect_timeout 5;
        add_header Access-Control-Allow-Origin *;
        add_header Cache-Control no-store;
    }

    location /api/world/test {
        proxy_pass http://192.168.86.99:25556/api/world;
        proxy_set_header Host $host;
        proxy_read_timeout 30;
        proxy_connect_timeout 5;
        add_header Access-Control-Allow-Origin *;
        add_header Cache-Control no-store;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}