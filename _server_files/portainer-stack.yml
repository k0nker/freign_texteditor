version: "3.8"

services:
  web:
    image: nginx:latest
    ports:
      - "5447:80"
    volumes:
      - /var/www/freign:/usr/share/nginx/html:ro
      - /usr/share/freign_nginx/conf.d:/etc/nginx/conf.d:ro
    depends_on:
      - play-bridge
    restart: always
    networks:
      - wekan-tier

  play-bridge:
    image: node:20-alpine
    working_dir: /app
    command: sh -c "npm install && npm start"
    environment:
      PLAY_WS_PORT: "9001"
      PLAY_WS_PATH: "/ws"
      PLAY_PROXY_PROTOCOL: "v2"
      PLAY_ENABLE_MCCP2: "false"
      PLAY_ENABLE_WS_COMPRESSION: "true"
      PLAY_WS_COMPRESSION_THRESHOLD: "512"
      PLAY_WS_COMPRESSION_LEVEL: "6"
      PLAY_ALLOW_HOSTS: "192.168.86.99"
      FRMAPPER_UPSTREAM_HOST: "192.168.86.99"
      FRMAPPER_TEST_PORT: "25556"
      FRMAPPER_PUBLIC_PORT: "25555"
    volumes:
      - /var/www/freign/play:/app
    restart: always
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - wekan-tier

networks:
  wekan-tier:
    driver: bridge
