<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>FREIGN World Map</title>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --bg: #0a0a0e;
    --text: #c8c0b0;
    --sidebar-bg: #111118;
    --sidebar-border: #2a2a38;
    --title: #e0c87a;
    --input-bg: #1a1a24;
    --input-border: #3a3a50;
    --card-bg: #1a1a26;
    --card-border: #2e2e42;
    --muted: #6a6880;
    --hint: #4a4860;
    --step-bg: #2a2a3a;
    --control-hint: #3a3858;
    --tooltip-bg: rgba(10,10,20,0.92);
  }

  body[data-theme="parchment"] {
    --bg: #efe5cd;
    --text: #3e3325;
    --sidebar-bg: #f8f0db;
    --sidebar-border: #b7a27c;
    --title: #6f4d1f;
    --input-bg: #fff8ea;
    --input-border: #bda883;
    --card-bg: #fff8e8;
    --card-border: #c4af88;
    --muted: #7a6543;
    --hint: #8b7859;
    --step-bg: #e8dcc2;
    --control-hint: #8b7859;
    --tooltip-bg: rgba(255,248,232,0.94);
  }

  body[data-theme="cobalt"] {
    --bg: #111722;
    --text: #c7d4e4;
    --sidebar-bg: #17202e;
    --sidebar-border: #31435b;
    --title: #b6d8ff;
    --input-bg: #202c3d;
    --input-border: #3e5573;
    --card-bg: #1d2a3b;
    --card-border: #3b516e;
    --muted: #8ba2bf;
    --hint: #6f87a5;
    --step-bg: #233348;
    --control-hint: #6f87a5;
    --tooltip-bg: rgba(20,30,46,0.94);
  }

  body {
    background: var(--bg);
    color: var(--text);
    font-family: 'Consolas', 'Courier New', monospace;
    font-size: 13px;
    display: flex;
    height: 100vh;
    overflow: hidden;
  }

  #canvas-wrap {
    flex: 1;
    position: relative;
    overflow: hidden;
    cursor: crosshair;
  }

  canvas {
    display: block;
    width: 100%;
    height: 100%;
  }

  /* ---- Sidebar ---- */
  #sidebar {
    width: 280px;
    min-width: 220px;
    background: var(--sidebar-bg);
    border-left: 1px solid var(--sidebar-border);
    display: flex;
    flex-direction: column;
    overflow: hidden;
  }

  #sidebar-header {
    padding: 14px 14px 10px;
    border-bottom: 1px solid var(--sidebar-border);
  }

  #sidebar-header h1 {
    font-size: 15px;
    letter-spacing: 0.12em;
    color: var(--title);
    text-transform: uppercase;
    margin-bottom: 8px;
  }

  #sidebar-controls {
    display: flex;
    flex-direction: column;
    gap: 8px;
    margin-bottom: 10px;
  }

  .sidebar-control-row {
    display: flex;
    align-items: center;
    gap: 8px;
  }

  .sidebar-control-label {
    width: 52px;
    flex-shrink: 0;
    font-size: 10px;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    color: var(--muted);
  }

  .sidebar-control-row button,
  .sidebar-control-row select {
    min-width: 0;
  }

  #search-wrap {
    display: flex;
    gap: 6px;
  }

  #search-input {
    flex: 1;
    background: var(--input-bg);
    border: 1px solid var(--input-border);
    color: var(--text);
    padding: 5px 8px;
    font: inherit;
    font-size: 12px;
    outline: none;
    border-radius: 2px;
  }
  #search-input:focus { border-color: var(--title); }

  #search-btn {
    background: var(--step-bg);
    border: 1px solid var(--input-border);
    color: var(--text);
    padding: 5px 10px;
    cursor: pointer;
    font: inherit;
    font-size: 12px;
    border-radius: 2px;
  }
  #search-btn:hover { filter: brightness(1.08); }

  #theme-wrap {
    display: flex;
    align-items: center;
    gap: 8px;
    width: 100%;
  }

  #theme-wrap label {
    font-size: 10px;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    color: var(--muted);
  }

  #theme-select {
    flex: 1;
    background: var(--input-bg);
    border: 1px solid var(--input-border);
    color: var(--text);
    font: inherit;
    font-size: 12px;
    padding: 5px 8px;
    border-radius: 2px;
    outline: none;
  }

  #sidebar-body {
    flex: 1;
    overflow-y: auto;
    padding: 10px 14px;
  }
  #sidebar-body::-webkit-scrollbar { width: 6px; }
  #sidebar-body::-webkit-scrollbar-track { background: var(--sidebar-bg); }
  #sidebar-body::-webkit-scrollbar-thumb { background: var(--input-border); border-radius: 3px; }

  .sb-section { margin-bottom: 14px; }

  .sb-label {
    font-size: 10px;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    color: var(--muted);
    margin-bottom: 5px;
  }

  .sb-room {
    background: var(--card-bg);
    border: 1px solid var(--card-border);
    padding: 6px 8px;
    margin-bottom: 4px;
    border-radius: 2px;
    cursor: pointer;
    transition: border-color 0.1s;
  }
  .sb-room:hover { filter: brightness(1.06); }
  .sb-room.origin { border-color: var(--title); }
  .sb-room.dest   { border-color: #7ab0e0; }

  .sb-room-name { color: var(--text); font-size: 12px; }
  .sb-room-meta { color: var(--muted); font-size: 11px; margin-top: 2px; }

  .sb-hint { color: var(--hint); font-size: 11px; font-style: italic; }

  #path-steps { list-style: none; }
  #path-steps li {
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 3px 0;
    border-bottom: 1px solid color-mix(in srgb, var(--sidebar-border) 55%, transparent);
    font-size: 12px;
  }
  #path-steps li:last-child { border-bottom: none; }

  .step-dir {
    display: inline-block;
    width: 22px;
    text-align: center;
    background: var(--step-bg);
    border-radius: 2px;
    padding: 1px 0;
    font-size: 11px;
    color: var(--title);
    flex-shrink: 0;
  }
  .step-room { color: color-mix(in srgb, var(--text) 82%, transparent); }

  /* ---- Legend ---- */
  #legend {
    padding: 10px 14px;
    border-top: 1px solid var(--sidebar-border);
    display: flex;
    flex-wrap: wrap;
    gap: 6px 10px;
  }
  .leg-item {
    display: flex;
    align-items: center;
    gap: 4px;
    font-size: 10px;
    color: var(--muted);
  }
  .leg-swatch {
    width: 10px;
    height: 10px;
    border-radius: 1px;
    border: 1px solid rgba(255,255,255,0.15);
  }

  /* ---- Controls hint ---- */
  #controls-hint {
    position: absolute;
    bottom: 10px;
    left: 10px;
    font-size: 10px;
    color: var(--control-hint);
    pointer-events: none;
    line-height: 1.6;
  }

  /* ---- Layer controls ---- */
  #layer-mode-btn {
    background: var(--step-bg);
    border: 1px solid var(--input-border);
    color: var(--muted);
    font: inherit;
    font-size: 10px;
    letter-spacing: 0.08em;
    padding: 4px 10px;
    border-radius: 3px;
    cursor: pointer;
    flex: 1;
  }
  #layer-mode-btn:hover { filter: brightness(1.12); color: var(--text); }

  #view-3d-btn {
    background: var(--step-bg);
    border: 1px solid var(--input-border);
    color: var(--muted);
    font: inherit;
    font-size: 10px;
    letter-spacing: 0.08em;
    padding: 4px 10px;
    border-radius: 3px;
    cursor: pointer;
    flex: 1;
  }
  #view-3d-btn:hover  { filter: brightness(1.12); color: var(--text); }
  #view-3d-btn.active { background: color-mix(in srgb, #3a6fa0 80%, transparent); color: #e8f0ff; border-color: #5090c0; }

  #true-map-btn {
    background: var(--step-bg);
    border: 1px solid var(--input-border);
    color: var(--muted);
    font: inherit;
    font-size: 10px;
    letter-spacing: 0.08em;
    padding: 4px 10px;
    border-radius: 3px;
    cursor: pointer;
    width: 100%;
  }
  #true-map-btn:hover { filter: brightness(1.12); color: var(--text); }
  #true-map-btn.active { background: color-mix(in srgb, #6c8f54 70%, transparent); color: #ebf9de; border-color: #7da760; }

  #layer-nav {
    display: none;
    flex-direction: row;
    align-items: center;
    gap: 6px;
    background: var(--card-bg);
    border: 1px solid var(--card-border);
    border-radius: 3px;
    padding: 4px 8px;
    width: 100%;
  }
  #layer-nav button {
    background: var(--step-bg);
    border: 1px solid var(--input-border);
    color: var(--text);
    font: inherit;
    font-size: 13px;
    width: 22px;
    height: 22px;
    cursor: pointer;
    border-radius: 2px;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 0;
  }
  #layer-nav button:hover:not(:disabled) { filter: brightness(1.15); }
  #layer-nav button:disabled { opacity: 0.3; cursor: default; }
  #layer-label {
    font-size: 11px;
    color: var(--title);
    min-width: 52px;
    text-align: center;
    letter-spacing: 0.06em;
  }

  /* ---- Tooltip ---- */
  #tooltip {
    position: absolute;
    background: var(--tooltip-bg);
    border: 1px solid var(--input-border);
    padding: 5px 8px;
    font-size: 11px;
    color: var(--text);
    pointer-events: none;
    border-radius: 2px;
    max-width: 220px;
    display: none;
    z-index: 10;
  }

  #legend {
    position: absolute;
    top: 10px;
    right: 10px;
    width: 148px;
    max-height: calc(100vh - 24px);
    overflow-y: auto;
    background: color-mix(in srgb, var(--sidebar-bg) 88%, transparent);
    border: 1px solid var(--sidebar-border);
    border-radius: 6px;
    padding: 10px 10px 8px;
    z-index: 9;
  }

  #legend-title {
    font-size: 10px;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    color: var(--muted);
    margin-bottom: 8px;
  }

  #legend-list {
    display: flex;
    flex-direction: column;
    gap: 6px;
  }

  /* ---- Loading overlay ---- */
  #loading {
    position: absolute;
    inset: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    background: var(--bg);
    color: var(--muted);
    font-size: 14px;
    letter-spacing: 0.1em;
  }
</style>
</head>
<body data-theme="cobalt">

<div id="canvas-wrap">
  <canvas id="map-canvas"></canvas>
  <canvas id="map-canvas-3d" style="display:none;position:absolute;top:0;left:0;width:100%;height:100%;"></canvas>
  <div id="legend">
    <div id="legend-title">Terrain Key</div>
    <div id="legend-list"></div>
  </div>
  <div id="controls-hint">
    Scroll: zoom &nbsp;·&nbsp; Drag: pan &nbsp;·&nbsp; Click: select origin → dest<br>
    Expanded mode: ↑ / ↓ arrows change floor
  </div>
  <div id="tooltip"></div>
  <div id="loading">Loading map data...</div>
</div>

<div id="sidebar">
  <div id="sidebar-header">
    <h1>FREIGN World Map</h1>
    <div id="sidebar-controls">
      <div class="sidebar-control-row">
        <div class="sidebar-control-label">Theme</div>
        <div id="theme-wrap">
          <select id="theme-select">
            <option value="cobalt">Cobalt</option>
            <option value="dark">Dark</option>
            <option value="parchment">Parchment</option>
          </select>
        </div>
      </div>
      <div class="sidebar-control-row">
        <div class="sidebar-control-label">View</div>
        <button id="layer-mode-btn">Layers: Collapsed</button>
        <button id="view-3d-btn">3D View</button>
      </div>
      <div class="sidebar-control-row">
        <div class="sidebar-control-label">Floor</div>
        <div id="layer-nav">
          <button id="layer-up">↑</button>
          <span id="layer-label">Floor 0</span>
          <button id="layer-down">↓</button>
        </div>
      </div>
      <div class="sidebar-control-row">
        <div class="sidebar-control-label">3D</div>
        <button id="true-map-btn">True Mapping: Off</button>
      </div>
    </div>
    <div id="search-wrap">
      <input id="search-input" type="text" placeholder="Jump to area or room…" autocomplete="off">
      <button id="search-btn">Go</button>
    </div>
  </div>

  <div id="sidebar-body">
    <div class="sb-section" id="section-origin">
      <div class="sb-label">Origin</div>
      <div class="sb-hint" id="hint-origin">Click a room on the map</div>
    </div>

    <div class="sb-section" id="section-dest">
      <div class="sb-label">Destination</div>
      <div class="sb-hint" id="hint-dest">Click a second room</div>
    </div>

    <div class="sb-section" id="section-path" style="display:none">
      <div class="sb-label">Path (<span id="path-length">0</span> steps)</div>
      <ul id="path-steps"></ul>
    </div>

    <div class="sb-section" id="section-search-results" style="display:none">
      <div class="sb-label">Search results</div>
      <div id="search-results-list"></div>
    </div>
  </div>
</div>

<script src="map3d.js"></script>
<script src="map.js"></script>
</body>
</html>
