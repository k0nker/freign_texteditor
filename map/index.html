<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>FREIGN World Map</title>
<link rel="stylesheet" href="../site-shell.css?v=1" />
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    --sidebar-bg: color-mix(in srgb, var(--panel, #1b1827) 90%, var(--bg, #12101a) 10%);
    --sidebar-border: var(--panel-border, #3d3452);
    --title: var(--title, #d7cee8);
    --input-bg: var(--input-bg, #232033);
    --input-border: var(--input-border, #4a4160);
    --card-bg: color-mix(in srgb, var(--panel, #1b1827) 78%, var(--input-bg, #232033) 22%);
    --card-border: color-mix(in srgb, var(--panel-border, #3d3452) 88%, transparent);
    --muted: var(--muted, #9e95b4);
    --hint: color-mix(in srgb, var(--muted, #9e95b4) 70%, var(--text, #ddd8ea));
    --step-bg: color-mix(in srgb, var(--input-bg, #232033) 72%, var(--accent, #7f6aa7) 28%);
    --control-hint: var(--muted, #9e95b4);
    --tooltip-bg: color-mix(in srgb, var(--panel, #1b1827) 85%, var(--bg, #12101a) 15%);
    background: var(--bg);
    color: var(--text);
    font-family: 'Consolas', 'Courier New', monospace;
    font-size: 13px;
    display: flex;
    flex-direction: column;
    height: 100vh;
    overflow: hidden;
  }

  body[data-theme-tone="light"] {
    --sidebar-bg: color-mix(in srgb, var(--panel, #f8f0db) 94%, white 6%);
    --card-bg: color-mix(in srgb, var(--panel, #f8f0db) 70%, var(--bg, #efe5cd) 30%);
    --card-border: color-mix(in srgb, var(--panel-border, #b7a27c) 80%, white 20%);
    --hint: color-mix(in srgb, var(--muted, #7a6543) 82%, var(--text, #3e3325) 18%);
    --step-bg: color-mix(in srgb, var(--accent, #9a6a2f) 18%, white 82%);
    --control-hint: color-mix(in srgb, var(--muted, #7a6543) 88%, var(--text, #3e3325) 12%);
    --tooltip-bg: color-mix(in srgb, var(--panel, #f8f0db) 94%, white 6%);
  }

  #map-layout {
    flex: 1;
    min-height: 0;
    display: flex;
  }

  #canvas-wrap {
    flex: 1;
    position: relative;
    overflow: hidden;
    cursor: crosshair;
    background: var(--map-canvas-bg, var(--terminal-bg, var(--bg)));
  }

  canvas {
    display: block;
    width: 100%;
    height: 100%;
    background: transparent;
  }

  /* ---- Sidebar ---- */
  #sidebar {
    width: 280px;
    min-width: 220px;
    background: var(--sidebar-bg);
    border-left: 1px solid var(--sidebar-border);
    display: flex;
    flex-direction: column;
    overflow: hidden;
  }

  #sidebar-header {
    padding: 14px 14px 10px;
    border-bottom: 1px solid var(--sidebar-border);
  }

  #sidebar-header h1 {
    font-size: 15px;
    letter-spacing: 0.12em;
    color: var(--title);
    text-transform: uppercase;
    margin-bottom: 8px;
  }

  #sidebar-controls {
    display: flex;
    flex-direction: column;
    gap: 8px;
    margin-bottom: 10px;
  }

  .sidebar-control-row {
    display: flex;
    align-items: center;
    gap: 8px;
  }

  .sidebar-control-label {
    width: 52px;
    flex-shrink: 0;
    font-size: 10px;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    color: var(--muted);
  }

  .sidebar-control-row button,
  .sidebar-control-row select {
    min-width: 0;
  }

  #search-wrap {
    display: flex;
    gap: 6px;
  }

  #search-input {
    flex: 1;
    background: var(--input-bg);
    border: 1px solid var(--input-border);
    color: var(--text);
    padding: 5px 8px;
    font: inherit;
    font-size: 12px;
    outline: none;
    border-radius: 2px;
  }
  #search-input:focus { border-color: var(--title); }

  #search-btn {
    background: var(--step-bg);
    border: 1px solid var(--input-border);
    color: var(--accent-ink, var(--text));
    padding: 5px 10px;
    cursor: pointer;
    font: inherit;
    font-size: 12px;
    border-radius: 2px;
  }
  #search-btn:hover { filter: brightness(1.08); }

  #theme-wrap {
    display: flex;
    align-items: center;
    gap: 8px;
    width: 100%;
  }

  #theme-wrap label {
    font-size: 10px;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    color: var(--muted);
  }

  #theme-select {
    flex: 1;
    background: var(--input-bg);
    border: 1px solid var(--input-border);
    color: var(--text);
    font: inherit;
    font-size: 12px;
    padding: 5px 8px;
    border-radius: 2px;
    outline: none;
  }

  #sidebar-body {
    flex: 1;
    overflow-y: auto;
    padding: 10px 14px;
  }
  #sidebar-body::-webkit-scrollbar { width: 6px; }
  #sidebar-body::-webkit-scrollbar-track { background: var(--sidebar-bg); }
  #sidebar-body::-webkit-scrollbar-thumb { background: var(--input-border); border-radius: 3px; }

  .sb-section { margin-bottom: 14px; }

  .sb-label {
    font-size: 10px;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    color: var(--muted);
    margin-bottom: 5px;
  }

  .sb-room {
    background: var(--card-bg);
    border: 1px solid var(--card-border);
    padding: 6px 8px;
    margin-bottom: 4px;
    border-radius: 2px;
    cursor: pointer;
    transition: border-color 0.1s;
  }
  .sb-room:hover { filter: brightness(1.06); }
  .sb-room.origin { border-color: var(--title); }
  .sb-room.dest   { border-color: #7ab0e0; }

  .sb-room-name { color: var(--text); font-size: 12px; }
  .sb-room-meta { color: var(--muted); font-size: 11px; margin-top: 2px; }

  .sb-hint { color: var(--hint); font-size: 11px; font-style: italic; }

  #path-steps { list-style: none; }
  #path-steps li {
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 3px 0;
    border-bottom: 1px solid color-mix(in srgb, var(--sidebar-border) 55%, transparent);
    font-size: 12px;
  }
  #path-steps li:last-child { border-bottom: none; }

  .step-dir {
    display: inline-block;
    width: 22px;
    text-align: center;
    background: var(--step-bg);
    border-radius: 2px;
    padding: 1px 0;
    font-size: 11px;
    color: var(--accent-ink, var(--title));
    flex-shrink: 0;
  }
  .step-room { color: color-mix(in srgb, var(--text) 82%, transparent); }

  /* ---- Legend ---- */
  #legend {
    padding: 10px 14px;
    border-top: 1px solid var(--sidebar-border);
    display: flex;
    flex-wrap: wrap;
    gap: 6px 10px;
  }
  .leg-item {
    display: flex;
    align-items: center;
    gap: 4px;
    font-size: 10px;
    color: var(--muted);
  }
  .leg-swatch {
    width: 10px;
    height: 10px;
    border-radius: 1px;
    border: 1px solid rgba(255,255,255,0.15);
  }

  /* ---- Controls hint ---- */
  #controls-hint {
    position: absolute;
    bottom: 10px;
    left: 10px;
    font-size: 10px;
    color: var(--control-hint);
    pointer-events: none;
    line-height: 1.6;
  }

  /* ---- Layer controls ---- */
  #layer-mode-btn {
    background: var(--step-bg);
    border: 1px solid var(--input-border);
    color: var(--muted);
    font: inherit;
    font-size: 10px;
    letter-spacing: 0.08em;
    padding: 4px 10px;
    border-radius: 3px;
    cursor: pointer;
    flex: 1;
  }
  #layer-mode-btn:hover { filter: brightness(1.12); color: var(--text); }

  #view-3d-btn {
    background: var(--step-bg);
    border: 1px solid var(--input-border);
    color: var(--muted);
    font: inherit;
    font-size: 10px;
    letter-spacing: 0.08em;
    padding: 4px 10px;
    border-radius: 3px;
    cursor: pointer;
    flex: 1;
  }
  #view-3d-btn:hover  { filter: brightness(1.12); color: var(--text); }
  #view-3d-btn.active { background: color-mix(in srgb, #3a6fa0 80%, transparent); color: #e8f0ff; border-color: #5090c0; }

  #true-map-btn {
    background: var(--step-bg);
    border: 1px solid var(--input-border);
    color: var(--muted);
    font: inherit;
    font-size: 10px;
    letter-spacing: 0.08em;
    padding: 4px 10px;
    border-radius: 3px;
    cursor: pointer;
    width: 100%;
  }
  #true-map-btn:hover { filter: brightness(1.12); color: var(--text); }
  #true-map-btn.active { background: color-mix(in srgb, #6c8f54 70%, transparent); color: #ebf9de; border-color: #7da760; }

  #layer-nav {
    display: none;
    flex-direction: row;
    align-items: center;
    gap: 6px;
    background: var(--card-bg);
    border: 1px solid var(--card-border);
    border-radius: 3px;
    padding: 4px 8px;
    width: 100%;
  }
  #layer-nav button {
    background: var(--step-bg);
    border: 1px solid var(--input-border);
    color: var(--text);
    font: inherit;
    font-size: 13px;
    width: 22px;
    height: 22px;
    cursor: pointer;
    border-radius: 2px;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 0;
  }
  #layer-nav button:hover:not(:disabled) { filter: brightness(1.15); }
  #layer-nav button:disabled { opacity: 0.3; cursor: default; }
  #layer-label {
    font-size: 11px;
    color: var(--title);
    min-width: 52px;
    text-align: center;
    letter-spacing: 0.06em;
  }

  /* ---- Tooltip ---- */
  #tooltip {
    position: absolute;
    background: var(--tooltip-bg);
    border: 1px solid var(--input-border);
    padding: 5px 8px;
    font-size: 11px;
    color: var(--text);
    pointer-events: none;
    border-radius: 2px;
    max-width: 220px;
    display: none;
    z-index: 10;
  }

  #legend {
    position: absolute;
    top: 10px;
    right: 10px;
    width: 148px;
    max-height: calc(100vh - 24px);
    overflow-y: auto;
    background: color-mix(in srgb, var(--sidebar-bg) 88%, transparent);
    border: 1px solid var(--sidebar-border);
    border-radius: 6px;
    padding: 10px 10px 8px;
    z-index: 9;
  }

  #legend-title {
    font-size: 10px;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    color: var(--muted);
    margin-bottom: 8px;
  }

  #legend-list {
    display: flex;
    flex-direction: column;
    gap: 6px;
  }

  /* ---- Loading overlay ---- */
  #loading {
    position: absolute;
    inset: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    background: var(--bg);
    color: var(--muted);
    font-size: 14px;
    letter-spacing: 0.1em;
  }
</style>
</head>
<body data-theme="amethyst">

<div class="fr-shellbar">
  <div class="fr-shellbar-inner">
    <nav class="fr-nav" aria-label="Main">
      <a href="/" class="fr-nav-item">home</a>
      <a href="/news/" class="fr-nav-item">news</a>
      <a href="/forum/" class="fr-nav-item">forum</a>
      <a href="/who/" class="fr-nav-item">who</a>
      <div class="fr-nav-group">
        <button type="button" class="fr-nav-item fr-nav-trigger" aria-haspopup="true">db</button>
        <div class="fr-submenu" role="menu" aria-label="db">
          <button type="button" class="fr-submenu-item" role="menuitem">objects</button>
          <button type="button" class="fr-submenu-item" role="menuitem">mobiles</button>
          <button type="button" class="fr-submenu-item" role="menuitem">help</button>
        </div>
      </div>
      <a href="/map/" class="fr-nav-item active">map</a>
      <a href="/play/" class="fr-nav-item">play</a>
    </nav>
    <div class="fr-theme-control">
      <label for="site-theme-select" class="fr-theme-label">theme</label>
      <select id="site-theme-select" aria-label="Theme selector"></select>
    </div>
  </div>
</div>

<div id="map-layout">

<div id="canvas-wrap">
  <canvas id="map-canvas"></canvas>
  <canvas id="map-canvas-3d" style="display:none;position:absolute;top:0;left:0;width:100%;height:100%;"></canvas>
  <div id="legend">
    <div id="legend-title">Terrain Key</div>
    <div id="legend-list"></div>
  </div>
  <div id="controls-hint">
    Scroll: zoom &nbsp;·&nbsp; Drag: pan &nbsp;·&nbsp; Click: select origin → dest<br>
    Expanded mode: ↑ / ↓ arrows change floor
  </div>
  <div id="tooltip"></div>
  <div id="loading">Loading map data...</div>
</div>

<div id="sidebar">
  <div id="sidebar-header">
    <h1>FREIGN World Map</h1>
    <div id="sidebar-controls">
      <div class="sidebar-control-row">
        <div class="sidebar-control-label">View</div>
        <button id="layer-mode-btn">Layers: Collapsed</button>
        <button id="view-3d-btn">3D View</button>
      </div>
      <div class="sidebar-control-row">
        <div class="sidebar-control-label">Floor</div>
        <div id="layer-nav">
          <button id="layer-up">↑</button>
          <span id="layer-label">Floor 0</span>
          <button id="layer-down">↓</button>
        </div>
      </div>
      <div class="sidebar-control-row">
        <div class="sidebar-control-label">3D</div>
        <button id="true-map-btn">True Mapping: Off</button>
      </div>
    </div>
    <div id="search-wrap">
      <input id="search-input" type="text" placeholder="Jump to area or room…" autocomplete="off">
      <button id="search-btn">Go</button>
    </div>
  </div>

  <div id="sidebar-body">
    <div class="sb-section" id="section-origin">
      <div class="sb-label">Origin</div>
      <div class="sb-hint" id="hint-origin">Click a room on the map</div>
    </div>

    <div class="sb-section" id="section-dest">
      <div class="sb-label">Destination</div>
      <div class="sb-hint" id="hint-dest">Click a second room</div>
    </div>

    <div class="sb-section" id="section-path" style="display:none">
      <div class="sb-label">Path (<span id="path-length">0</span> steps)</div>
      <ul id="path-steps"></ul>
    </div>

    <div class="sb-section" id="section-search-results" style="display:none">
      <div class="sb-label">Search results</div>
      <div id="search-results-list"></div>
    </div>
  </div>
</div>

</div>

<script src="../site-themes.js?v=2"></script>
<script src="../site-shell.js?v=3"></script>
<script src="map3d.js?v=2"></script>
<script src="map.js?v=2"></script>
</body>
</html>
