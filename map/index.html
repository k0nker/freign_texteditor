<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>FREIGN World Map</title>
<link rel="stylesheet" href="../site-shell.css?v=3" />
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    --sidebar-bg: color-mix(in srgb, var(--panel, #1b1827) 90%, var(--bg, #12101a) 10%);
    --sidebar-border: var(--panel-border, #3d3452);
    --title: var(--title, #d7cee8);
    --input-bg: var(--input-bg, #232033);
    --input-border: var(--input-border, #4a4160);
    --card-bg: color-mix(in srgb, var(--panel, #1b1827) 78%, var(--input-bg, #232033) 22%);
    --card-border: color-mix(in srgb, var(--panel-border, #3d3452) 88%, transparent);
    --muted: var(--muted, #9e95b4);
    --hint: color-mix(in srgb, var(--muted, #9e95b4) 70%, var(--text, #ddd8ea));
    --step-bg: color-mix(in srgb, var(--input-bg, #232033) 72%, var(--accent, #7f6aa7) 28%);
    --control-hint: var(--muted, #9e95b4);
    --tooltip-bg: color-mix(in srgb, var(--panel, #1b1827) 85%, var(--bg, #12101a) 15%);
    background: var(--bg);
    color: var(--text);
    font-family: 'Consolas', 'Courier New', monospace;
    font-size: 13px;
    display: flex;
    flex-direction: column;
    height: 100vh;
    overflow: hidden;
  }

  body[data-theme-tone="light"] {
    --sidebar-bg: color-mix(in srgb, var(--panel, #f8f0db) 94%, white 6%);
    --card-bg: color-mix(in srgb, var(--panel, #f8f0db) 70%, var(--bg, #efe5cd) 30%);
    --card-border: color-mix(in srgb, var(--panel-border, #b7a27c) 80%, white 20%);
    --hint: color-mix(in srgb, var(--muted, #7a6543) 82%, var(--text, #3e3325) 18%);
    --step-bg: color-mix(in srgb, var(--accent, #9a6a2f) 18%, white 82%);
    --control-hint: color-mix(in srgb, var(--muted, #7a6543) 88%, var(--text, #3e3325) 12%);
    --tooltip-bg: color-mix(in srgb, var(--panel, #f8f0db) 94%, white 6%);
  }

  #map-layout {
    flex: 1;
    min-height: 0;
    display: flex;
  }

  #canvas-wrap {
    flex: 1;
    position: relative;
    overflow: hidden;
    cursor: crosshair;
    background: var(--map-canvas-bg, var(--terminal-bg, var(--bg)));
  }

  canvas {
    display: block;
    width: 100%;
    height: 100%;
    background: transparent;
  }

  /* ---- Sidebar ---- */
  #sidebar {
    width: 280px;
    min-width: 220px;
    background: var(--sidebar-bg);
    border-left: 1px solid var(--sidebar-border);
    display: flex;
    flex-direction: column;
    overflow: hidden;
  }

  #sidebar-header {
    padding: 14px 14px 10px;
    border-bottom: 1px solid var(--sidebar-border);
  }

  #sidebar-header h1 {
    font-size: 15px;
    letter-spacing: 0.12em;
    color: var(--title);
    text-transform: uppercase;
    margin-bottom: 8px;
  }

  /* ---- 2D/3D view toggle pill ---- */
  #view-toggle-wrap {
    display: flex;
    background: var(--input-bg);
    border: 1px solid var(--input-border);
    border-radius: 4px;
    padding: 2px;
    gap: 2px;
    margin-bottom: 10px;
  }
  .view-tab {
    flex: 1;
    background: transparent;
    border: none;
    color: var(--muted);
    font: inherit;
    font-size: 11px;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    padding: 5px 0;
    border-radius: 3px;
    cursor: pointer;
    transition: background 0.15s, color 0.15s;
  }
  .view-tab.active {
    background: var(--step-bg);
    color: var(--title);
  }
  .view-tab:hover:not(.active) {
    background: color-mix(in srgb, var(--step-bg) 50%, transparent);
    color: var(--text);
  }

  /* ---- Mode-specific option panels ---- */
  #mode-options-2d,
  #mode-options-3d {
    display: flex;
    flex-direction: column;
    gap: 7px;
    margin-bottom: 8px;
  }
  #mode-options-3d { display: none; }

  /* ---- Slide toggles ---- */
  .slide-toggle {
    display: flex;
    align-items: center;
    gap: 9px;
    cursor: pointer;
    user-select: none;
    padding: 1px 0;
  }
  .slide-toggle input[type="checkbox"] { display: none; }
  .slider {
    width: 32px;
    height: 17px;
    background: var(--input-border);
    border-radius: 9px;
    position: relative;
    flex-shrink: 0;
    transition: background 0.2s;
  }
  .slider::after {
    content: '';
    position: absolute;
    top: 2px;
    left: 2px;
    width: 13px;
    height: 13px;
    border-radius: 50%;
    background: var(--muted);
    transition: transform 0.2s, background 0.2s;
  }
  .slide-toggle input:checked ~ .slider {
    background: color-mix(in srgb, var(--accent, #7f6aa7) 68%, transparent);
  }
  .slide-toggle input:checked ~ .slider::after {
    transform: translateX(15px);
    background: var(--title, #d7cee8);
  }
  .toggle-label {
    font-size: 11px;
    letter-spacing: 0.06em;
    color: var(--muted);
    transition: color 0.15s;
  }
  .slide-toggle input:checked ~ .toggle-label { color: var(--text); }

  /* ---- Common options (always visible) ---- */
  #common-options {
    display: flex;
    flex-direction: column;
    gap: 7px;
    margin-bottom: 10px;
  }
  .opt-row {
    display: flex;
    align-items: center;
    gap: 8px;
  }
  .opt-label {
    width: 42px;
    flex-shrink: 0;
    font-size: 10px;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    color: var(--muted);
  }
  .realm-row {
    display: flex;
    gap: 5px;
    flex: 1;
  }

  /* ---- Autocomplete search ---- */
  #search-wrap {
    position: relative;
  }
  #search-input {
    width: 100%;
    background: var(--input-bg);
    border: 1px solid var(--input-border);
    color: var(--text);
    padding: 5px 8px;
    font: inherit;
    font-size: 12px;
    outline: none;
    border-radius: 2px;
  }
  #search-input:focus { border-color: var(--title); }
  #search-dropdown {
    display: none;
    position: absolute;
    top: 100%;
    left: 0;
    right: 0;
    background: var(--sidebar-bg);
    border: 1px solid var(--input-border);
    border-top: none;
    border-radius: 0 0 3px 3px;
    z-index: 20;
    max-height: 220px;
    overflow-y: auto;
  }
  .drop-item {
    padding: 5px 8px;
    cursor: pointer;
    border-bottom: 1px solid color-mix(in srgb, var(--sidebar-border) 40%, transparent);
    font-size: 12px;
  }
  .drop-item:last-child { border-bottom: none; }
  .drop-item:hover, .drop-item.drop-active { background: var(--step-bg); }
  .drop-item-name { color: var(--text); }
  .drop-item-meta { font-size: 10px; color: var(--muted); margin-top: 1px; }

  #theme-wrap {
    display: flex;
    align-items: center;
    gap: 8px;
    width: 100%;
  }

  #theme-wrap label {
    font-size: 10px;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    color: var(--muted);
  }

  #theme-select {
    flex: 1;
    background: var(--input-bg);
    border: 1px solid var(--input-border);
    color: var(--text);
    font: inherit;
    font-size: 12px;
    padding: 5px 8px;
    border-radius: 2px;
    outline: none;
  }

  #sidebar-body {
    flex: 1;
    overflow-y: auto;
    padding: 10px 14px;
  }
  #sidebar-body::-webkit-scrollbar { width: 6px; }
  #sidebar-body::-webkit-scrollbar-track { background: var(--sidebar-bg); }
  #sidebar-body::-webkit-scrollbar-thumb { background: var(--input-border); border-radius: 3px; }

  .sb-section { margin-bottom: 14px; }

  .sb-label {
    font-size: 10px;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    color: var(--muted);
    margin-bottom: 5px;
  }

  .sb-room {
    background: var(--card-bg);
    border: 1px solid var(--card-border);
    padding: 6px 8px;
    margin-bottom: 4px;
    border-radius: 2px;
    cursor: pointer;
    transition: border-color 0.1s;
  }
  .sb-room:hover { filter: brightness(1.06); }
  .sb-room.origin { border-color: var(--title); }
  .sb-room.dest   { border-color: #7ab0e0; }

  .sb-room-name { color: var(--text); font-size: 12px; }
  .sb-room-meta { color: var(--muted); font-size: 11px; margin-top: 2px; }

  .sb-hint { color: var(--hint); font-size: 11px; font-style: italic; }

  #path-steps { list-style: none; }
  #path-steps li {
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 3px 0;
    border-bottom: 1px solid color-mix(in srgb, var(--sidebar-border) 55%, transparent);
    font-size: 12px;
  }
  #path-steps li:last-child { border-bottom: none; }

  .step-dir {
    display: inline-block;
    width: 22px;
    text-align: center;
    background: var(--step-bg);
    border-radius: 2px;
    padding: 1px 0;
    font-size: 11px;
    color: var(--accent-ink, var(--title));
    flex-shrink: 0;
  }
  .step-room { color: color-mix(in srgb, var(--text) 82%, transparent); }

  /* ---- Legend ---- */
  #legend {
    padding: 10px 14px;
    border-top: 1px solid var(--sidebar-border);
    display: flex;
    flex-wrap: wrap;
    gap: 6px 10px;
  }
  .leg-item {
    display: flex;
    align-items: center;
    gap: 4px;
    font-size: 10px;
    color: var(--muted);
  }
  .leg-swatch {
    width: 10px;
    height: 10px;
    border-radius: 1px;
    border: 1px solid rgba(255,255,255,0.15);
  }

  /* ---- Controls hint ---- */
  #controls-hint {
    position: absolute;
    bottom: 10px;
    left: 10px;
    font-size: 10px;
    color: var(--control-hint);
    pointer-events: none;
    line-height: 1.6;
  }

  /* ---- Copy path button ---- */
  #copy-path-btn {
    margin-top: 6px;
    width: 100%;
    background: var(--step-bg);
    border: 1px solid var(--input-border);
    color: var(--muted);
    font: inherit;
    font-size: 11px;
    letter-spacing: 0.06em;
    padding: 5px 10px;
    border-radius: 3px;
    cursor: pointer;
    text-align: center;
  }
  #copy-path-btn:hover { filter: brightness(1.12); color: var(--text); }
  #copy-path-btn:active { filter: brightness(0.9); }

  #grid-select {
    flex: 1;
    background: var(--input-bg);
    border: 1px solid var(--input-border);
    color: var(--text);
    font: inherit;
    font-size: 12px;
    padding: 4px 8px;
    border-radius: 3px;
    outline: none;
    cursor: pointer;
  }
  #grid-select:focus { border-color: var(--title); }

  .realm-btn {
    background: var(--step-bg);
    border: 1px solid var(--input-border);
    color: var(--muted);
    font: inherit;
    font-size: 10px;
    letter-spacing: 0.08em;
    padding: 4px 8px;
    border-radius: 3px;
    cursor: pointer;
    flex: 1;
  }
  .realm-btn:hover { filter: brightness(1.1); color: var(--text); }

  #layer-nav {
    display: none;
    flex-direction: row;
    align-items: center;
    gap: 6px;
    background: var(--card-bg);
    border: 1px solid var(--card-border);
    border-radius: 3px;
    padding: 4px 8px;
    width: 100%;
  }
  #layer-nav button {
    background: var(--step-bg);
    border: 1px solid var(--input-border);
    color: var(--text);
    font: inherit;
    font-size: 13px;
    width: 22px;
    height: 22px;
    cursor: pointer;
    border-radius: 2px;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 0;
  }
  #layer-nav button:hover:not(:disabled) { filter: brightness(1.15); }
  #layer-nav button:disabled { opacity: 0.3; cursor: default; }
  #layer-label {
    font-size: 11px;
    color: var(--title);
    min-width: 52px;
    text-align: center;
    letter-spacing: 0.06em;
  }

  /* ---- Tooltip ---- */
  #tooltip {
    position: absolute;
    background: var(--tooltip-bg);
    border: 1px solid var(--input-border);
    padding: 5px 8px;
    font-size: 11px;
    color: var(--text);
    pointer-events: none;
    border-radius: 2px;
    max-width: 220px;
    display: none;
    z-index: 10;
  }

  #legend {
    position: absolute;
    top: 10px;
    right: 10px;
    width: 148px;
    max-height: calc(100vh - 24px);
    overflow-y: auto;
    background: color-mix(in srgb, var(--sidebar-bg) 88%, transparent);
    border: 1px solid var(--sidebar-border);
    border-radius: 6px;
    padding: 10px 10px 8px;
    z-index: 9;
  }

  #legend-title {
    font-size: 10px;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    color: var(--muted);
    margin-bottom: 8px;
  }

  #legend-list {
    display: flex;
    flex-direction: column;
    gap: 6px;
  }

  /* ---- Loading overlay ---- */
  #loading {
    position: absolute;
    inset: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    background: var(--bg);
    color: var(--muted);
    font-size: 14px;
    letter-spacing: 0.1em;
  }
</style>
</head>
<body data-theme="amethyst">
<div id="fr-shellbar-mount" data-active-nav="map"></div>

<div id="map-layout">

<div id="canvas-wrap">
  <canvas id="map-canvas"></canvas>
  <canvas id="map-canvas-3d" style="display:none;position:absolute;top:0;left:0;width:100%;height:100%;"></canvas>
  <div id="legend">
    <div id="legend-title">Terrain Key</div>
    <div id="legend-list"></div>
  </div>
  <div id="controls-hint">
    Scroll: zoom &nbsp;·&nbsp; Drag: pan &nbsp;·&nbsp; Click: select origin → dest<br>
    Expanded mode: ↑ / ↓ arrows change floor
  </div>
  <div id="tooltip"></div>
  <div id="loading">Loading map data...</div>
</div>

<div id="sidebar">
  <div id="sidebar-header">
    <h1>FREIGN World Map</h1>

    <!-- 2D / 3D pill toggle -->
    <div id="view-toggle-wrap">
      <button id="toggle-2d" class="view-tab active">2D</button>
      <button id="toggle-3d" class="view-tab">3D</button>
    </div>

    <!-- 2D-specific options -->
    <div id="mode-options-2d">
      <label class="slide-toggle">
        <input type="checkbox" id="layer-mode-chk">
        <span class="slider"></span>
        <span class="toggle-label">Expand Layers</span>
      </label>
      <div id="layer-nav">
        <button id="layer-up">↑</button>
        <span id="layer-label">Floor 0</span>
        <button id="layer-down">↓</button>
      </div>
    </div>

    <!-- 3D-specific options -->
    <div id="mode-options-3d">
      <label class="slide-toggle">
        <input type="checkbox" id="true-map-chk">
        <span class="slider"></span>
        <span class="toggle-label">True Mapping</span>
      </label>
      <label class="slide-toggle">
        <input type="checkbox" id="cube-mode-chk">
        <span class="slider"></span>
        <span class="toggle-label">Cubes</span>
      </label>
    </div>

    <!-- Always-visible options -->
    <div id="common-options">
      <div class="opt-row">
        <span class="opt-label">Grid</span>
        <select id="grid-select"><option value="global">global</option></select>
      </div>
      <div class="opt-row">
        <span class="opt-label">Realm</span>
        <div class="realm-row">
          <button id="use-public-map-btn" class="realm-btn">Public Map</button>
          <button id="use-test-map-btn"   class="realm-btn">Test Map</button>
        </div>
      </div>
      <div id="search-wrap">
        <input id="search-input" type="text" placeholder="Jump to area or room…" autocomplete="off" spellcheck="false">
        <div id="search-dropdown"></div>
      </div>
    </div>
  </div>

  <div id="sidebar-body">
    <div class="sb-section" id="section-origin">
      <div class="sb-label">Origin</div>
      <div class="sb-hint" id="hint-origin">Click a room on the map</div>
    </div>

    <div class="sb-section" id="section-dest">
      <div class="sb-label">Destination</div>
      <div class="sb-hint" id="hint-dest">Click a second room</div>
    </div>

    <div class="sb-section" id="section-path" style="display:none">
      <div class="sb-label">Path (<span id="path-length">0</span> steps)</div>
      <ul id="path-steps"></ul>
      <button id="copy-path-btn" style="display:none">Copy stacked command</button>
    </div>
  </div>
</div>

</div>

<script src="../site-themes.js?v=2"></script>
<script src="../site-shell.js?v=4"></script>
<script src="map3d.js?v=2"></script>
<script src="map.js?v=2"></script>
</body>
</html>
