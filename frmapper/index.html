<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>frmapper</title>
  <link rel="stylesheet" href="../site-shell.css?v=3" />
  <link rel="stylesheet" href="./style.css" />
</head>
<body>
  <div id="fr-shellbar-mount" data-active-nav="map"></div>
  <div class="app">
    <button id="embed-toggle" class="embed-toggle" type="button" title="Show mapper controls" aria-label="Show mapper controls" aria-expanded="false" hidden>
      <span class="embed-toggle-icon" aria-hidden="true">&#9660;</span>
    </button>
    <div id="embed-quick-controls" class="embed-quick-controls" hidden>
      <div class="embed-quick-row">
        <button id="embed-z-down" class="embed-quick-btn embed-z-chevron embed-z-down" type="button" aria-label="Previous z-layer"><span class="sr-only">Down</span></button>
        <span id="embed-z-label" class="embed-z-label">z=0</span>
        <button id="embed-z-up" class="embed-quick-btn embed-z-chevron embed-z-up" type="button" aria-label="Next z-layer"><span class="sr-only">Up</span></button>
        <button id="embed-follow" class="embed-quick-btn embed-follow-btn active" type="button" aria-label="Follow player" aria-pressed="true">&#10004;</button>
        <button id="embed-follow-tracked" class="embed-quick-btn embed-follow-tracked-btn" type="button" aria-label="Center on tracked player" aria-pressed="false" hidden>&#9679;</button>
      </div>
      <div id="embed-room-meta" class="embed-room-meta" hidden>
        <span id="embed-room-nsid" class="embed-room-meta-token">NSID: --</span>
        <span id="embed-room-eph" class="embed-room-meta-token">ephNum: --</span>
        <button id="embed-localid-toggle" class="embed-room-meta-toggle" type="button" aria-pressed="false" title="Show localID labels on map">IDs Off</button>
      </div>
    </div>
    <div id="embed-quick-tooltip" class="room-hover-tooltip embed-quick-tooltip" hidden></div>

    <header class="topbar">
      <div class="brand">frmapper</div>
      <div class="topbar-actions">
        <button id="btn-debug-log" type="button" title="Toggle connection debug log">Debug</button>
        <label class="file-button" for="file-input">Load JSON</label>
        <input id="file-input" type="file" accept="application/json" />
        <button id="btn-export" type="button">Export JSON</button>
        <button id="btn-clear-map" type="button">Clear Map</button>
      </div>
    </header>

    <div class="layout">
      <aside class="sidebar">
        <section class="panel">
          <h2>Map Controls</h2>
          <div class="control-row">
            <label for="zoom-range">Zoom</label>
            <input id="zoom-range" type="range" min="0.5" max="3" step="0.1" value="1" />
            <span id="zoom-value">100%</span>
          </div>
          <div class="control-row">
            <label for="grid-id">Grid</label>
            <select id="grid-id"></select>
          </div>
          <div class="control-row">
            <label for="z-level">Z Level</label>
            <select id="z-level"></select>
          </div>
          <div class="control-row control-row-check">
            <label for="toggle-party">Party</label>
            <input id="toggle-party" type="checkbox" checked />
            <span>Show</span>
          </div>
          <div class="control-row control-row-check">
            <label for="toggle-mobs">Mobs</label>
            <input id="toggle-mobs" type="checkbox" checked />
            <span>Hints</span>
          </div>
          <div class="control-row control-row-check">
            <label for="toggle-traveled-path">Traveled Path</label>
            <input id="toggle-traveled-path" type="checkbox" checked />
            <span>Show</span>
          </div>
          <div class="control-row control-row-check">
            <label for="toggle-fog">Fog of War</label>
            <input id="toggle-fog" type="checkbox" checked />
            <span>Show</span>
          </div>
          <div class="control-row control-row-check">
            <label for="toggle-grid-outline">Grid Outline</label>
            <input id="toggle-grid-outline" type="checkbox" />
            <span>Show</span>
          </div>
          <div class="control-row control-row-check">
            <label for="toggle-perf-stats">Perf Stats</label>
            <input id="toggle-perf-stats" type="checkbox" />
            <span>Show</span>
          </div>
          <pre id="perf-stats" class="perf-stats" hidden>Perf stats disabled.</pre>
          <p class="hint">Drag to pan. Scroll to zoom. Click a room to inspect it.</p>
        </section>

        <section class="panel">
          <h2>Legend</h2>
          <div id="legend" class="legend"></div>
        </section>

        <section class="panel">
          <h2>Selected Room</h2>
          <pre id="room-inspector">No room selected.</pre>
        </section>
      </aside>

      <main class="canvas-wrap">
        <canvas id="map-canvas" width="1200" height="800" aria-label="frmapper grid canvas"></canvas>
        <div id="room-hover-tooltip" class="room-hover-tooltip" hidden></div>
        <div id="context-menu" class="context-menu" hidden>
          <button id="menu-remove-room" type="button">Remove Room</button>
          <button id="menu-clear-area" type="button">Clear This Area</button>
          <button id="menu-clear-map" type="button">Clear Map</button>
        </div>
      </main>
    </div>
  </div>

  <div id="fr-debug-panel" style="display:none;position:fixed;bottom:10px;right:10px;z-index:9999;width:480px;max-height:320px;background:var(--fm-panel,#111118);border:1px solid var(--fm-panel-border,#2a2a38);border-radius:6px;font-family:monospace;font-size:11px;color:var(--fm-text,#c8cdd6);box-shadow:0 4px 20px rgba(0,0,0,.6);flex-direction:column;">
    <div style="display:flex;align-items:center;justify-content:space-between;padding:4px 8px;border-bottom:1px solid var(--fm-panel-border,#2a2a38);flex-shrink:0;">
      <span style="font-weight:bold;letter-spacing:.04em;">frmapper debug log</span>
      <div style="display:flex;gap:6px;">
        <button id="btn-debug-clear" type="button" style="background:none;border:1px solid var(--fm-panel-border,#2a2a38);color:inherit;border-radius:3px;padding:1px 6px;cursor:pointer;font-size:10px;">Clear</button>
        <button id="btn-debug-close" type="button" style="background:none;border:none;color:inherit;cursor:pointer;font-size:14px;padding:0 2px;" title="Close">&times;</button>
      </div>
    </div>
    <div id="fr-debug-entries" style="overflow-y:auto;flex:1;padding:4px 8px;"></div>
  </div>

  <script src="../site-themes.js?v=1"></script>
  <script src="../site-shell.js?v=3" defer></script>
  <script src="./app.js"></script>
</body>
</html>
